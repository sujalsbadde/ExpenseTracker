name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: Build Shared Types & Contracts
        run: npm run build --workspace=shared

      - name: Run Backend Integration & Unit Tests
        run: npm run test:backend
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_jwt_access_secret_key_ci_environment
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_ci_environment

      - name: Run Frontend Component Tests
        run: npm run test:frontend
        env:
          VITE_API_BASE_URL: /api/v1

      - name: Run Production Bundle Build
        run: npm run build
